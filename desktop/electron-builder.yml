appId: dev.gitwebui.app
productName: GitWebUI
copyright: GitWebUI

directories:
  output: ../release/desktop
  buildResources: build

# Only the built output ships. `src/`, `tests/`, `build.mjs` and the icon
# sources have no business inside the installed app.
files:
  - dist/**
  - renderer/**
  - build/icon.png
  - package.json

# Nothing needs to sit outside the archive: every process this app spawns —
# git, optional git-filter-repo, the user's shell, taskkill, the file manager —
# is a host tool, never one we ship. That is also why there are no asarUnpack
# rules and no extraResources.
asar: true

# There are no native modules and no runtime dependencies at all: core and the
# main process are bundled into dist/main.js, so there is nothing to rebuild
# against Electron's ABI.
npmRebuild: false

# Git is required; history deletion additionally needs git-filter-repo. Said
# here so it survives into the package metadata rather than living only in the
# README.
extraMetadata:
  description: A local Git client. Requires git; history deletion requires git-filter-repo.

win:
  icon: build/icon.ico
  # One standalone executable, no installer. Electron, the app's core and the
  # built UI are inside it; git and optional git-filter-repo remain host tools.
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: GitWebUI-${version}.${ext}
  # Extracted to a fixed directory under %LOCALAPPDATA%\Temp rather than a fresh
  # one per launch, so starting it a second time doesn't unpack ~200 MB again.
  unpackDirName: GitWebUI

linux:
  icon: build/icon.png
  category: Development
  executableName: gitwebui
  syncDesktopName: true
  artifactName: GitWebUI-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]

# Unsigned, and so not notarized: there is no Apple developer identity behind
# this project, and electron-builder would otherwise go looking for one in the
# keychain. Gatekeeper therefore refuses the app until the user clears its
# quarantine flag (see the README). Both targets need a Mac to come out right:
# the DMG needs hdiutil, and a zip made on Linux flattens the framework's
# symbolic links. Off a Mac the `dir` target is what proves the packaging.
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: null
  artifactName: GitWebUI-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
